name: Deploy ArcSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arcsync-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Validar antes do deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Gerar tipos de rotas Next.js
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build da imagem de produção
        run: docker build --target runner --tag arcsync:ci .

  deploy:
    name: Deploy para a VPS
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Registrar host da VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Executar deploy
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo -n /usr/local/bin/deploy-feedsync'
