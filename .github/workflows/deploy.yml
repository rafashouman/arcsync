name: Deploy FeedSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: feedsync-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para a VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Registrar host da VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Executar deploy
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo /usr/local/bin/deploy-feedsync'
