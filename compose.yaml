services:
  app:
    build:
      context: .
      target: development
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/feedsync
      PUBLIC_APP_URL: http://localhost:3000
      FEEDSYNC_UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - uploads:/app/uploads

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
  node_modules:
  next_cache:
  uploads:
